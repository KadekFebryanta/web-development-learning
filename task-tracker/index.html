<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="task-tracker">
        <h1>Task Tracker</h1>
        <p>Catat tugas yang ingin kamu kerjakan</p>

        <!-- Form input -->
        <div>
            <form class="task-form" id="task-form">
                <label for="namaTugas">Nama Tugas</label>
                <input type="text" name="namaTugas" id="namaTugas" class="task-input" placeholder="Masukkan tugas baru..." required>
                <button class="task-button" type="submit">Tambah Tugas</button>
            </form>
        </div>
        <!-- Form input -->
        
        <!-- Daftar Tugas -->
        <h2>Daftar Tugas</h2>
        <div>
            <ul class="task-list">
                <li>Belajar JavaScript</li>
                <li>Membuat Website Portofolio</li>
                <li>Belajar Vibe Coding</li>
            </ul>
        </div>
        <!-- Daftar Tugas -->
        
    </main>

    <script src="main.js"></script>
</body>
</html>
