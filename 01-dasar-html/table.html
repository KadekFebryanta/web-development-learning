<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table | HTML</title>
</head>
<body>
    <table border="solid 1px" style="border-collapse: collapse; width: 500px;">
        <tr>
            <th>Nama</th>
            <th>Kelas</th>
            <th>Orang Tua</th>
        </tr>
        <tr>
            <td>Ana</td>
            <td>III</td>
            <td>Pak Tana</td>
        </tr>
        <tr>
            <td>Yana</td>
            <td>VI</td>
            <td>Pak Ina</td>
        </tr>
        <tr>
            <td>Rara</td>
            <td>VII</td>
            <td>Ibu Idah</td>
        </tr>
    </table>

    <div style="margin-top: 125px;">
        <table border="solid 1px" style="border-collapse: collapse; width: 500px;">
            <tr>
                <th rowspan="2">Nama</th>
                <th rowspan="2">Kelas</th>
                <th colspan="2">Orang Tua</th>
            </tr>
            <tr>
                <th>Ayah</th>
                <th>Ibu</th>
            </tr>
            <tr>
                <td>Yolo</td>
                <td>II</td>
                <td>Pak Alang</td>
                <td>Ibu Idah</td>  
            </tr>
            <tr>
                <td>Rina</td>
                <td>III</td>
                <td>Pak Galang</td>
                <td>Ibu Siska</td>
            </tr>
            <tr>
                <td>Rani</td>
                <td>III</td>
                <td>Pak Gadi</td>
                <td>Ibu Dini</td>
            </tr>
        </table>
    </div>

    <div style="margin-top: 125px;">
        <table border="solid 1px" style="border-collapse: collapse; width: 500px;">
            <tr>
                <th>Nama</th>
                <td>Joni</td>
            </tr>
            <tr>
                <th rowspan="2">No. Kontak</th>
                <td>0123-456-789</td>
            </tr>
            <tr>
                <td>0123-456-789</td>
            </tr>
        </table>
    </div>
</body>
</html>
