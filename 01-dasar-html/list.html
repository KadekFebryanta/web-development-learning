<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List | HTML</title>
</head>
<body>
    <h2>Order List</h2>

    <h3>Daftar Minuman :</h3>

    <div>
        <ol type="1" start="1">
            <li>Kopi</li>
            <li>Teh</li>
            <li>Susu</li>
        </ol>
    </div>

    <div>
        <ol>
            <li>Kopi</li>
            <li>Teh</li>
                <ol>
                    <li>Teh Manis</li>
                    <li>Teh Tawar</li>
                </ol>
            <li>Susu</li>
        </ol>
    </div>
    
    <hr>

    <h2>Un-Order List</h2>

    <div>
        <ul>
            <li>Kopi</li>
            <li>Teh</li>
            <li>Susu</li>
        </ul>
    </div>
    <div>
        <ul style="list-style-type: square;">
            <li>Kopi</li>
                <ul>
                    <li>Kopi Hitam</li>
                    <li>Kopi Susu</li>
                </ul>
            <li>Teh</li>
            <ul>
                    <li>Teh Manis</li>
                    <li>Teh Tawar</li>
                </ul>
            <li>Susu</li>
        </ul>
    </div>

</body>
</html>
